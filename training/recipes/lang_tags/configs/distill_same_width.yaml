model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  flow_lm.transformer.num_layers: 6
  flow_lm.lookup_table.tokenizer: tokenizers
  flow_lm.lookup_table.tokenizer_path: training/recipes/lang_tags/tokenizer/lang_tags_4000.json
  flow_lm.lookup_table.n_bins: 4000
start_from_pretrained: false

distill_cfg_coef: 2.0
distill_teacher_config: pocket_tts/config/english_2026-04_24l.yaml
distill_teacher_overrides:
  flow_lm.lookup_table.tokenizer: tokenizers
  flow_lm.lookup_table.tokenizer_path: training/recipes/lang_tags/tokenizer/lang_tags_4000.json
  flow_lm.lookup_table.n_bins: 4000
distill_teacher_weights: runs/lang_tags_teacher/checkpoint_00200000.pt

data:
  train_jsonl: data/lang_tags/train.jsonl
  valid_jsonl: data/lang_tags/valid.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0
  precompute: true
  loader_procs: 6

flow:
  type: lsd
  kwargs: {}

text_dropout: 0.0
voice_dropout: 0.0

optim:
  lr: 4e-4
  schedule: cosine
  warmup_steps: 1000

run_dir: runs/lang_tags_distill_6l
batch_size: 64
grad_accum_steps: 1
max_steps: 200000
ema_decay: 0.9999
log_freq: 50
valid_freq: 2500
num_valid_batches: 50
keep_best_metric: loss
early_stop_patience: 8
ckpt_freq: 5000
num_ckpt_keep: 20
sample_cfg_coef: 1.0
sample_freq: 10000
sample_sentences:
  - "<lang:eng> Hello there, how are you today?"
  - "<lang:tw> ɛna yɛn nhyiam no bɛkɔ so wɔ anɔpa."
