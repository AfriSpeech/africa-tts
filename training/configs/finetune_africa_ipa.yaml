# Multilingual African teacher, text as IPA (africa-g2p C library; English via espeak-ng).
# Kyutai's new-language recipe (finetune_language): warm start from the English 24-layer
# teacher, fresh text table for the new 4k IPA SentencePiece tokenizer, lr 2e-4 (constant,
# 1k warmup), batch 64, nothing frozen. Early stopping on validation loss.
# Data: 755 h (92 African languages + Ghanaian English, number-free, ctc-forced-aligner) +
# 166 h HiFiTTS-2 English. See AfriSpeech/african-speech-tts-aligned.
model_config: pocket_tts/config/english_2026-04_24l.yaml
model_overrides:
  flow_lm.lookup_table.tokenizer: tokenizers
  flow_lm.lookup_table.tokenizer_path: recipes/africa/tokenizer/ipa_sp4000.json
  flow_lm.lookup_table.n_bins: 4000
start_from_pretrained: true
reset_text_embedding: true

data:
  train_jsonl: data/africa-tts/train_final.jsonl
  valid_jsonl: data/africa-tts/valid_final.jsonl
  max_duration_sec: 30.0
  max_voice_prompt_sec: 5.0
  precompute: true
  loader_procs: 6

flow:
  type: lsd
  kwargs: {}

flow_batch_multiplier: 4
eos_loss_weight: 0.1
text_dropout: 0.2
voice_dropout: 0.2

optim:
  lr: 2e-4
  schedule: constant
  warmup_steps: 1000

run_dir: runs/africa_ipa_teacher
batch_size: 64
grad_accum_steps: 1
max_steps: 200000          # ceiling; early stopping ends the run well before
stats_ema_steps: 1000
ema_decay: 0.999
log_freq: 50
valid_freq: 1000
num_valid_batches: 50
keep_best_metric: loss     # -> best_checkpoint.pt / best_model.safetensors
early_stop_patience: 20    # stop after 20 validations (20k steps) without improvement
ckpt_freq: 5000
num_ckpt_keep: 10
sample_cfg_coef: 2.0
sample_freq: 5000
sample_sentences:          # IPA, as the model reads it: Twi, Zulu, English
  - "mesɾɛ wo sɛ, ɛnnɛ jɛbɛkɔ fie no akjiɾi."
  - "sawubona, uɲd͡ʒani namɬaɲd͡ʒe?"
  - "həloʊ ɡɑːnə, haʊ ɑːɹ juː tədeɪ?"
