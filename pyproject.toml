[project]
name = "africa-tts"
version = "0.2.0"
description = "Fast CPU text-to-speech for 92 African languages and English, no PyTorch needed"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "AfriSpeech / Ghana NLP" }]
keywords = ["tts", "text-to-speech", "african-languages", "speech-synthesis", "voice-cloning", "ipa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # Inference only, no PyTorch: the int8 sherpa-onnx bundle (ONNX Runtime) on CPU.
    "sherpa-onnx>=2.0.1,<3",
    # 0.3.4: the G2P tables the model was trained with (commit 76b53a8; 0.3.2 predates fixes)
    "africa-g2p[english]>=0.3.4,<0.4",
    "huggingface_hub>=0.30",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.scripts]
africa-tts = "africa_tts.cli:main"

[project.urls]
Models = "https://huggingface.co/AfriSpeech/africa-tts"
Samples = "https://huggingface.co/spaces/AfriSpeech/africa-tts-samples"
Source = "https://github.com/AfriSpeech/africa-tts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["africa_tts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"recipes/**" = ["E402"]
