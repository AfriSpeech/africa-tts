[project]
name = "africa-tts"
version = "0.5.0"
description = "Fast, high-fidelity text-to-speech for 92 African languages and English: PyTorch on CPU or GPU"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "AfriSpeech" }]
keywords = ["tts", "text-to-speech", "african-languages", "speech-synthesis", "voice-cloning", "ipa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # Engine: PyTorch on CPU or GPU (unquantised fp32 quality).
    # 0.3.4: the G2P tables the model was trained with (commit 76b53a8; 0.3.2 predates fixes)
    "africa-g2p[english]>=0.3.4,<0.4",
    "huggingface_hub>=0.30",
    "numpy>=1.24",
    "pocket-tts>=4.0.1,<5",
    "pyyaml>=6.0",
    "soundfile>=0.12",
    # API server (africa-tts serve)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",  # includes websockets (streaming endpoint)
]

[project.optional-dependencies]
torch = ["pocket-tts>=4.0.1,<5", "pyyaml>=6.0"]

[project.scripts]
africa-tts = "africa_tts.cli:main"

[project.urls]
Models = "https://huggingface.co/AfriSpeech/africa-tts"
Samples = "https://huggingface.co/spaces/AfriSpeech/africa-tts-samples"
Source = "https://github.com/AfriSpeech/africa-tts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["africa_tts"]

[tool.hatch.build.targets.sdist]
exclude = ["build", "paper", "benchmarks/results", "*.pdf", "*.tar.gz"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"recipes/**" = ["E402"]
