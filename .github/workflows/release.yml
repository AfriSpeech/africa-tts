# Build universal wheel and sdist and publish to PyPI on a version tag (v*).
#
# PyPI Trusted Publishing (OIDC): no API token in this repository. PyPI has a publisher for
# project africa-tts with owner AfriSpeech, repository africa-tts, workflow release.yml,
# environment pypi. The tag must equal the version in pyproject.toml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # build and test without publishing

jobs:
  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag pyproject=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag != version $ver"; exit 1; }

      - name: Build tools
        run: python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - name: Smoke-test the built wheel
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu
          cd "$RUNNER_TEMP"
          python -c "import africa_tts; print(len(africa_tts.languages()), 'languages')"
          python -c "from africa_tts import to_ipa; print(to_ipa('Akwaaba! Yɛfrɛ me Kofi.', 'twi'))"
          africa-tts --list-languages | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
