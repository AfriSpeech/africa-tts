# Build platform wheels (audio.cpp compiled in) and publish to PyPI on a version tag (v*).
#
# Each wheel bundles audio.cpp's C API library (third_party/audiocpp/build.py: pinned commit +
# patches, Pocket TTS only, CPU; on x86 every ISA variant, picked at run time). The Python code
# loads it with ctypes, so one wheel per platform serves every Python version (py3-none-<plat>).
#
# PyPI Trusted Publishing (OIDC): no API token in this repository. PyPI has a publisher for
# project africa-tts with owner AfriSpeech, repository africa-tts, workflow release.yml,
# environment pypi. The tag must equal the version in pyproject.toml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # build and test the wheels without publishing

jobs:
  wheels:
    name: wheel ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            plat: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            plat: manylinux_2_28_aarch64
          - os: macos-14
            plat: macosx_11_0_arm64
            target: "11.0"
          - os: macos-15-intel
            plat: macosx_10_15_x86_64
            target: "10.15"
          - os: windows-latest
            plat: win_amd64
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Python (manylinux image)
        if: matrix.container
        run: echo "/opt/python/cp311-cp311/bin" >> "$GITHUB_PATH"
      - name: Python
        if: ${{ !matrix.container }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag pyproject=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag != version $ver"; exit 1; }

      - name: Build tools
        run: python -m pip install build wheel cmake ninja

      - name: Build audio.cpp (C API, Pocket TTS, CPU)
        run: python third_party/audiocpp/build.py --jobs 4

      - name: Build the wheel and tag it for this platform
        shell: bash
        run: |
          python -m build --wheel
          python -m wheel tags --remove --python-tag py3 --abi-tag none --platform-tag ${{ matrix.plat }} dist/*.whl
          ls -la dist

      - name: Vendor runtime libraries (Linux)
        if: matrix.container
        run: |
          python -m pip install auditwheel
          auditwheel repair --plat ${{ matrix.plat }} -w wheelhouse dist/*.whl
          rm dist/*.whl && mv wheelhouse/*.whl dist/
      - name: Vendor runtime libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install delvewheel
          delvewheel repair --add-path africa_tts/lib -w wheelhouse dist/*.whl
          rm dist/*.whl && mv wheelhouse/*.whl dist/

      # Install the wheel outside the source tree and load the engine without downloading the
      # model: the library and its CPU kernels must be in the wheel.
      - name: Smoke-test the installed wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from africa_tts import _audiocpp; _audiocpp.lib(); print('audio.cpp loaded')"
          python -c "import sys, africa_tts.tts; assert 'torch' not in sys.modules; print('no torch')"
          python -c "from africa_tts import to_ipa; print(to_ipa('Akwaaba! Yɛfrɛ me Kofi.', 'twi'))"
          africa-tts --list-languages | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine && python -m build --sdist && twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
