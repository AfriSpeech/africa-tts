# Publish africa-tts to PyPI when a version tag (v*) is pushed.
#
# Uses PyPI Trusted Publishing (OIDC): no API token in this repository. PyPI must have a publisher
# for project africa-tts with owner AfriSpeech, repository africa-tts, workflow release.yml and
# environment pypi (for the first release, a "pending publisher" under the PyPI account's
# Publishing settings). The tag must equal the version in pyproject.toml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # dry-run the build without tagging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag pyproject=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag != version $ver"; exit 1; }

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # Install the built wheel and run the front end and CLI without downloading the model,
      # from outside the source tree.
      - name: Smoke-test the installed wheel
        run: |
          pip install dist/*.whl
          cd /tmp
          python -c "import africa_tts; print(africa_tts.to_ipa('Akwaaba! Yɛfrɛ me Kofi.', 'twi'))"
          africa-tts --list-languages | head -3
          python -c "import sys, africa_tts.tts; assert 'torch' not in sys.modules; print('no torch')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
