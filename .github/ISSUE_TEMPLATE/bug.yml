name: Bug report
description: Something in the code, export or mobile front end does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: "What happened, and what did you expect?"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: How to reproduce (commands, code, platform)}
    validations: {required: true}
  - type: textarea
    id: env
    attributes: {label: Environment (OS, Python, pocket-tts / sherpa-onnx / espeak-ng versions)}
